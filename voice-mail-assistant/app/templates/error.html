{% extends "base.html" %}
{% set nav_mode = 'guest' %}
{% block title %}{{ title }} · {{ cfg.APP_NAME }}{% endblock %}
{% block content %}
<section class="error-page">
  <div class="code">{{ code }}</div>
  <h1>{{ title }}</h1>
  <p>{{ text }}</p>
  <div class="hero-actions">
    <a class="primary-btn" href="{{ url_for('pages.landing') }}">Go to home</a>
    <a class="secondary-btn" href="{{ url_for('pages.help_center') }}">Help center</a>
  </div>
</section>
{% endblock %}
